<!DOCTYPE html>

<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SKY.AURA</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Arial, Helvetica, sans-serif;
    min-height: 100vh;
    color: white;
    background: linear-gradient(135deg, #0f172a, #1e3a8a);
    padding: 25px;
    transition: background 0.5s;
}

.contenedor {
    max-width: 1100px;
    margin: auto;
}

/* CABECERA */

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    margin-bottom: 25px;
    flex-wrap: wrap;
}

.logo {
    font-size: 28px;
    font-weight: bold;
}

.logo span {
    color: #38bdf8;
}

.busqueda {
    display: flex;
    gap: 10px;
}

.busqueda input {
    width: 230px;
    padding: 13px;
    border: none;
    border-radius: 12px;
    outline: none;
}

.busqueda button {
    border: none;
    border-radius: 12px;
    padding: 13px 18px;
    background: #38bdf8;
    color: #082f49;
    font-weight: bold;
    cursor: pointer;
}

/* PRINCIPAL */

.principal {
    background: rgba(255,255,255,0.10);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 30px;
    padding: 35px;
    margin-bottom: 20px;
}

.ubicacion {
    font-size: 22px;
    margin-bottom: 20px;
}

.clima-principal {
    display: flex;
    align-items: center;
    gap: 30px;
    flex-wrap: wrap;
}

.icono {
    font-size: 90px;
}

.temperatura {
    font-size: 75px;
    font-weight: bold;
}

.estado {
    font-size: 20px;
    opacity: 0.85;
}

/* DATOS */

.datos {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 15px;
    margin-top: 30px;
}

.card {
    background: rgba(255,255,255,0.10);
    padding: 20px;
    border-radius: 20px;
}

.card .emoji {
    font-size: 30px;
}

.card p {
    opacity: 0.7;
    margin-top: 10px;
}

.card strong {
    display: block;
    font-size: 22px;
    margin-top: 5px;
}

/* PRONÓSTICO */

.titulo {
    font-size: 24px;
    margin: 30px 0 15px;
}

.pronostico {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 10px;
}

.dia {
    background: rgba(255,255,255,0.10);
    padding: 18px 10px;
    border-radius: 18px;
    text-align: center;
}

.dia .fecha {
    font-weight: bold;
}

.dia .clima-icono {
    font-size: 35px;
    margin: 15px 0;
}

.max {
    font-weight: bold;
}

.min {
    opacity: 0.6;
    margin-top: 5px;
}

/* ESTADO */

.estado-carga {
    text-align: center;
    margin: 20px;
    opacity: 0.7;
}

/* RESPONSIVE */

@media (max-width: 800px) {

    .datos {
        grid-template-columns: repeat(2, 1fr);
    }

    .pronostico {
        grid-template-columns: repeat(2, 1fr);
    }

}

@media (max-width: 500px) {

    body {
        padding: 15px;
    }

    .principal {
        padding: 25px;
    }

    .temperatura {
        font-size: 60px;
    }

    .busqueda {
        width: 100%;
    }

    .busqueda input {
        width: 100%;
    }

}

</style>

</head>

<body>

<div class="contenedor">

<header>

```
<div class="logo">
    🌤️ Sky<span>Aura</span>
</div>

<div class="busqueda">

    <input
        type="text"
        id="ciudadInput"
        placeholder="Buscar ciudad..."
    >

    <button onclick="buscarCiudad()">
        🔍 Buscar
    </button>

</div>
```

</header>

<div class="principal">

```
<div class="ubicacion" id="ubicacion">
    📍 San Nicolás, Chile
</div>

<div class="clima-principal">

    <div class="icono" id="icono">
        🌤️
    </div>

    <div>

        <div class="temperatura" id="temperatura">
            --°C
        </div>

        <div class="estado" id="estado">
            Cargando clima...
        </div>

    </div>

</div>


<div class="datos">

    <div class="card">

        <div class="emoji">🌡️</div>

        <p>Sensación</p>

        <strong id="sensacion">
            --°C
        </strong>

    </div>


    <div class="card">

        <div class="emoji">💧</div>

        <p>Humedad</p>

        <strong id="humedad">
            --%
        </strong>

    </div>


    <div class="card">

        <div class="emoji">💨</div>

        <p>Viento</p>

        <strong id="viento">
            -- km/h
        </strong>

    </div>


    <div class="card">

        <div class="emoji">🌧️</div>

        <p>Lluvia</p>

        <strong id="lluvia">
            -- mm
        </strong>

    </div>

</div>
```

</div>

<h2 class="titulo">
    📅 Pronóstico de 7 días
</h2>

<div class="pronostico" id="pronostico">

```
<div class="estado-carga">
    Cargando pronóstico...
</div>
```

</div>

<div class="estado-carga" id="actualizado">
    Conectando con el servidor meteorológico...
</div>

</div>

<script>

/* ==========================================
   CONFIGURACIÓN INICIAL
========================================== */

let latitud = -36.5;
let longitud = -72.2;

let nombreCiudad = "San Nicolás, Chile";


/* ==========================================
   ICONOS DEL CLIMA
========================================== */

function obtenerIcono(codigo) {

    if (codigo === 0)
        return "☀️";

    if ([1,2,3].includes(codigo))
        return "🌤️";

    if ([45,48].includes(codigo))
        return "🌫️";

    if ([51,53,55,56,57].includes(codigo))
        return "🌦️";

    if ([61,63,65,66,67].includes(codigo))
        return "🌧️";

    if ([71,73,75,77].includes(codigo))
        return "❄️";

    if ([80,81,82].includes(codigo))
        return "🌧️";

    if ([95,96,99].includes(codigo))
        return "⛈️";

    return "🌤️";
}


/* ==========================================
   DESCRIPCIÓN DEL CLIMA
========================================== */

function descripcion(codigo) {

    if (codigo === 0)
        return "Despejado";

    if ([1,2,3].includes(codigo))
        return "Parcialmente nublado";

    if ([45,48].includes(codigo))
        return "Niebla";

    if ([51,53,55,56,57].includes(codigo))
        return "Llovizna";

    if ([61,63,65,66,67].includes(codigo))
        return "Lluvia";

    if ([71,73,75,77].includes(codigo))
        return "Nieve";

    if ([80,81,82].includes(codigo))
        return "Chubascos";

    if ([95,96,99].includes(codigo))
        return "Tormenta";

    return "Clima variable";
}


/* ==========================================
   OBTENER CLIMA
========================================== */

async function obtenerClima() {

    const url =
        `https://api.open-meteo.com/v1/forecast?` +
        `latitude=${latitud}` +
        `&longitude=${longitud}` +
        `&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m` +
        `&daily=weather_code,temperature_2m_max,temperature_2m_min` +
        `&temperature_unit=celsius` +
        `&wind_speed_unit=kmh` +
        `&precipitation_unit=mm` +
        `&timezone=auto`;


    try {

        const respuesta = await fetch(url);

        const datos = await respuesta.json();

        const actual = datos.current;


        /* TEMPERATURA */

        document.getElementById("temperatura").textContent =
            Math.round(actual.temperature_2m) + "°C";


        /* SENSACIÓN */

        document.getElementById("sensacion").textContent =
            Math.round(actual.apparent_temperature) + "°C";


        /* HUMEDAD */

        document.getElementById("humedad").textContent =
            actual.relative_humidity_2m + "%";


        /* VIENTO */

        document.getElementById("viento").textContent =
            Math.round(actual.wind_speed_10m) + " km/h";


        /* LLUVIA */

        document.getElementById("lluvia").textContent =
            actual.precipitation + " mm";


        /* ICONO */

        document.getElementById("icono").textContent =
            obtenerIcono(actual.weather_code);


        /* DESCRIPCIÓN */

        document.getElementById("estado").textContent =
            descripcion(actual.weather_code);


        /* CIUDAD */

        document.getElementById("ubicacion").textContent =
            "📍 " + nombreCiudad;


        /* PRONÓSTICO */

        mostrarPronostico(datos.daily);


        /* HORA */

        const hora = new Date();

        document.getElementById("actualizado").textContent =
            "🟢 Actualizado a las " +
            hora.toLocaleTimeString("es-CL", {
                hour: "2-digit",
                minute: "2-digit"
            });


    } catch (error) {

        document.getElementById("estado").textContent =
            "❌ No se pudo cargar el clima";

        console.error(error);

    }

}


/* ==========================================
   PRONÓSTICO
========================================== */

function mostrarPronostico(daily) {

    const contenedor =
        document.getElementById("pronostico");

    contenedor.innerHTML = "";


    for (let i = 0; i < 7; i++) {

        const fecha =
            new Date(daily.time[i] + "T12:00:00");


        const nombreDia =
            fecha.toLocaleDateString("es-CL", {
                weekday: "short"
            });


        const tarjeta =
            document.createElement("div");

        tarjeta.className = "dia";


        tarjeta.innerHTML = `

            <div class="fecha">
                ${nombreDia}
            </div>

            <div class="clima-icono">
                ${obtenerIcono(daily.weather_code[i])}
            </div>

            <div class="max">
                ${Math.round(daily.temperature_2m_max[i])}°C
            </div>

            <div class="min">
                ${Math.round(daily.temperature_2m_min[i])}°C
            </div>

        `;


        contenedor.appendChild(tarjeta);

    }

}


/* ==========================================
   BUSCAR CIUDAD
========================================== */

async function buscarCiudad() {

    const ciudad =
        document.getElementById("ciudadInput")
        .value
        .trim();


    if (ciudad === "") {

        alert("Escribe una ciudad primero.");

        return;

    }


    try {

        const url =
            `https://geocoding-api.open-meteo.com/v1/search?` +
            `name=${encodeURIComponent(ciudad)}` +
            `&count=1&language=es&format=json`;


        const respuesta =
            await fetch(url);


        const datos =
            await respuesta.json();


        if (!datos.results || datos.results.length === 0) {

            alert("No encontramos esa ciudad.");

            return;

        }


        const lugar =
            datos.results[0];


        latitud =
            lugar.latitude;

        longitud =
            lugar.longitude;


        nombreCiudad =
            lugar.name +
            (lugar.country ? ", " + lugar.country : "");


        obtenerClima();


    } catch (error) {

        alert("Error buscando la ciudad.");

    }

}


/* ==========================================
   ENTER PARA BUSCAR
========================================== */

document
    .getElementById("ciudadInput")
    .addEventListener("keydown", function(event) {

        if (event.key === "Enter") {

            buscarCiudad();

        }

    });


/* ==========================================
   INICIAR
========================================== */

obtenerClima();


/* ACTUALIZAR CADA 5 MINUTOS */

setInterval(
    obtenerClima,
    5 * 60 * 1000
);

</script>

</body>
</html>
